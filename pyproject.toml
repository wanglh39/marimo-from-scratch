[project]
name = "marimo-from-scratch"
version = "0.1.0"
description = "从零实现 marimo：理解 reactive notebook 的底层原理与设计哲学"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]


[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
